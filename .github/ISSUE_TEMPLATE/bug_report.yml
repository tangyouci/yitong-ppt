name: Bug report
description: Report incorrect triggering, workflow behavior, or a broken resource.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: request
    attributes:
      label: Request that triggered the issue
      description: Remove private material before posting.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Codex environment
      placeholder: Codex desktop, Codex CLI, or another compatible host

